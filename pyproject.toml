[project]
name = "tenshokuagent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "google-cloud-firestore>=2.32.0",
    "pydantic>=2.13.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
