[project]
name = "tenshokuagent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server]>=1.2.0",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "google-adk>=2.10.0",
    "google-auth>=2.58.1",
    "google-cloud-firestore>=2.32.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "opentelemetry-sdk>=1.42.1",
    "pydantic>=2.13.5",
    "sse-starlette>=3.5.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15",
]

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = ["design", ".venv"]

[tool.ruff.lint]
# 致命的な誤り(構文・未定義名・未使用 import など)だけを見る。書式は縛らない。
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
# pytest のフィクスチャは import して使う(引数名で参照されるので、未使用・再定義に見える)。
"tests/**" = ["F401", "F811"]
