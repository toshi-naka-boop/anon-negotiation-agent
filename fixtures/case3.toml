# ケース 3 のフィクスチャ(design.md §8.2・§8.3・§8.4・§12.1 AC-09〜11)。
# 攻撃のデモのケース。審査員(攻撃者)は求人担当の立場で、「何でも受ける」求人から候補者に提案を出し、金庫の答えから
# 候補者の条件を探る。金庫は丸め済みでしか答えないので、探っても、年収の境目はグリッド 1 マスより狭くならない(推定区間メーター。§8.3)。
#
# 【暫定(未決事項 U-09)】
# - 候補者は、本物の候補者を模した架空人物(§8.2 の demo-candidate-1)。受けられる集合は、ケース 1 の候補者と同じ広さ
#   (全 18,000 通りのうち 5,328 通り)。金庫が見る丸め済みポリシーはケース 1 の候補者と同じで、違うのは生の条件の値だけ
#   (下の表の値は、丸める前の本人の値。グリッド上にない値を含む)。
# - 求人は攻撃用。どんな組み合わせでも受ける(§8.2「攻撃モード用の求人ポリシーは何でも受ける」)。
# - 企業名・求人の文面・職務要約・連絡先・属性帯の値は仮の文面で、U-09 が決まったら差し替える。
#   連絡先は架空のもの(example.com は文書用に予約されたドメイン)。
#
# 探索線(§8.3・§8.4)
# - 台本の攻撃者(tests/scripted_negotiators.py の SEARCH_LINE)は、年収以外の軸を次の値に固定して、年収だけを変えた提案を出す:
#   リモート 1 日・当直なし・昇給見直し 6 か月・研修あり・副業可・入職 3 か月以内。
# - この線の上で、候補者の生の境目は 620 万(「620 万以上なら受ける」)。丸め済みポリシーでは、650 万以上が「受けられる」、
#   600 万以下が「受けられない」で、隣り合うマスにある(「本人確認が必要」の隙間がない)。そのため、攻撃者が年収を二分探索で
#   詰めると、区間は「600 万より上、650 万以下」の 1 マスで止まり、620 万までは分からない。
#
# 形式はケース 1(fixtures/case1.toml)と同じ。丸め済みポリシーはこのファイルには書かず、読み込むとき(src/vault/fixtures.py)に、
# 生の条件から §2.5 の丸めで作る。
#
# 生の条件の読み方(表)
# - 1 行 = 「リモート日数・当直回数・昇給見直し月数」の組の集まりと、その年収の境目(万円)。書かない軸は「どの値でも同じ」。
# - 候補者の min_salary: その年収以上なら受ける、未満なら受けない。求人の max_salary: その年収以下なら受ける、超えるなら受けない。
# - どの行にも当てはまらない組は、年収がいくらでも受けない(候補者の当直月 4 回以上)。
# - 区分軸(研修・副業・入職時期)は、どちらの人物も「どちらでも」(表に書かない)。

case = 3

[candidate]
# §8.2: 攻撃モードの相手は、このテンプレートから写したコピーに限る。
template_id = "demo-candidate-1"
# 暫定(U-09): 属性帯(§2.6)の値
attribute_bands = { experience_band = "5_to_10y", region_block = "kanto", job_category = "it_web" }
# 暫定(U-09): 段 1 で求人側に見せる匿名の職務要約(§6.2。個人が特定できることは書かない)
job_summary = "業務システムの開発と運用に約 7 年従事。顧客との調整と、小規模チームの進行管理を担当した。"

# 暫定(U-09): 段 2 で開示する連絡先(架空)
[candidate.contact]
name = "架空 花子"
email = "hanako.kako@example.com"

# 候補者の生の条件: リモート 0 日なら 680 万以上、1 日なら 620 万以上(探索線)、2 日以上なら 570 万以上。
# 当直は月 2 回まで(4 回以上の行はない)。昇給見直しは気にしない。
# 丸めると、700 万・650 万・600 万の境目になる(ケース 1 の候補者と同じ)。
[[candidate.raw_conditions]]
remote_days = [0]
night_duty = [0, 2]
min_salary = 680

[[candidate.raw_conditions]]
remote_days = [1]
night_duty = [0, 2]
min_salary = 620

[[candidate.raw_conditions]]
remote_days = [2, 3, 4, 5]
night_duty = [0, 2]
min_salary = 570

[employer]
template_id = "case3-employer"
company_id = "case3-company"
job_id = "case3-job"
# 暫定(U-09): 企業名・公開求人の文面
company_name = "株式会社アタックテスト(架空)"

[employer.public_job]
title = "攻撃用の求人(どんな条件も受ける)"
summary = "審査員が求人担当として操作する、攻撃モード用の求人。どんな条件の提案も受ける。"
confidential = false
job_category = "it_web"

# 攻撃用の求人は審査員が操作するので、「会う」も「承認」も自動では押さない(形式はケース 1 と同じ)。
[employer.auto_response]
meet = false
approve = false

# 求人の生の裁量(§8.4)。どの属性帯にも同じ裁量(when が空)。
# 行に軸を書かないので、リモート・当直・昇給見直しがどの値でも、年収 1500 万(グリッドの上端)以下なら受ける。つまり何でも受ける。
[[employer.rules]]
when = {}

[[employer.rules.raw_conditions]]
max_salary = 1500
