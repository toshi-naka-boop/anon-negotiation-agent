# ケース 1 のフィクスチャ(design.md §8.4・§12.2 DV-14)。
# 「年収だけでは合意できないが、リモートや当直を動かせば合意できる」デモのケース。
#
# 【暫定(未決事項 U-09)】
# - 人物の条件(下の [[...raw_conditions]])は、7 巡目の批評のシミュレーション
#   (design/anon-negotiation-agent/reviews/round-7-sim/exp6.py の手作りのケース 1)の人物にそろえてある。
#   両者が受けられる組み合わせは 288 通り(全 18,000 通りのうち)。
# - 企業名・求人の文面・職務要約・連絡先・属性帯の値は仮の文面で、U-09 が決まったら差し替える。
#   連絡先は架空のもの(example.com は文書用に予約されたドメイン)。
#
# 形式(§8.4)
# - 候補者: 生の条件(raw_conditions)・丸め済みポリシー・属性帯・職務要約・連絡先
# - 求人: 企業名・公開求人・生の裁量(rules の raw_conditions)・丸め済みポリシー(属性帯の条件付き)・自動応答の設定
# - 丸め済みポリシーはこのファイルには書かない。読み込むとき(src/vault/fixtures.py)に、生の条件から
#   §2.5 の丸めで作る。生の条件と丸め済みポリシーが食い違うことが起きないようにするため。
#
# 生の条件の読み方(表)
# - 1 行 = 「リモート日数・当直回数・昇給見直し月数」の組の集まりと、その年収の境目(万円)。
#   軸の値は配列で並べる。書かない軸は「どの値でも同じ」(昇給見直しは、どちらの人物も気にしない)。
# - 候補者の min_salary: その年収以上なら受ける、未満なら受けない。
#   求人の max_salary: その年収以下なら受ける、超えるなら受けない。
# - どの行にも当てはまらない組は、年収がいくらでも受けない(候補者の当直月 4 回以上、求人のリモート週 4 日以上)。
#   同じ組を 2 つの行に書くと、読み込みで拒否される。
# - 区分軸(研修・副業・入職時期)は、どちらの人物も「どちらでも」(表に書かない)。

case = 1

[candidate]
template_id = "case1-candidate"
# 暫定(U-09): 属性帯(§2.6)の値
attribute_bands = { experience_band = "5_to_10y", region_block = "kanto", job_category = "it_web" }
# 暫定(U-09): 段 1 で求人側に見せる匿名の職務要約(§6.2。個人が特定できることは書かない)
job_summary = "Web サービスのインフラ運用と開発に約 8 年従事。運用の自動化と障害対応を担当し、5 名のチームのリーダーを務めた。"

# 暫定(U-09): 段 2 で開示する連絡先(架空)
[candidate.contact]
name = "架空 太郎"
email = "taro.kako@example.com"

# 候補者の生の条件: リモート 0 日なら 700 万以上、1 日なら 650 万以上、2 日以上なら 600 万以上。
# 当直は月 2 回まで(4 回以上の行はない)。昇給見直しは気にしない。
[[candidate.raw_conditions]]
remote_days = [0]
night_duty = [0, 2]
min_salary = 700

[[candidate.raw_conditions]]
remote_days = [1]
night_duty = [0, 2]
min_salary = 650

[[candidate.raw_conditions]]
remote_days = [2, 3, 4, 5]
night_duty = [0, 2]
min_salary = 600

[employer]
template_id = "case1-employer"
company_id = "case1-company"
job_id = "case1-job"
# 暫定(U-09): 企業名・公開求人の文面
company_name = "株式会社サンプルシステムズ(架空)"

[employer.public_job]
title = "インフラエンジニア(運用・保守)"
summary = "自社サービスのサーバとネットワークの運用・保守。夜間の障害対応の当番あり。出社が中心。"
confidential = false
job_category = "it_web"

# 架空の求人は、「会う」と「承認」を自動で押す(§6.2・P-2)。
[employer.auto_response]
meet = true
approve = true

# 求人の生の裁量(§8.4)。規則は上から順に見て、最初に属性帯の条件(when)が合ったものを使う(§2.2)。
# ケース 1 は、どの属性帯にも同じ裁量(when が空)。
# リモート 2 日までなら年収の上限 650 万、3 日なら 600 万、4 日以上は不可。
# 当直が月 2 回以上なら、上限を 50 万上げる。昇給見直しは気にしない。
[[employer.rules]]
when = {}

[[employer.rules.raw_conditions]]
remote_days = [0, 1, 2]
night_duty = [0]
max_salary = 650

[[employer.rules.raw_conditions]]
remote_days = [0, 1, 2]
night_duty = [2, 4, 6, 8]
max_salary = 700

[[employer.rules.raw_conditions]]
remote_days = [3]
night_duty = [0]
max_salary = 600

[[employer.rules.raw_conditions]]
remote_days = [3]
night_duty = [2, 4, 6, 8]
max_salary = 650
