# --- ブロック先の選択(§5 の 8・§6.1。FR-07。P-1 の回答) ---
# 企業の一覧には、公開求人・非公開求人の有無に関係なく全企業を載せ、求人があるかどうかは示さない。
[blocklist]
prompt = "いまの勤め先の企業を、紹介の相手から外せます。一覧から選んでください(選ばなくても進めます)。"
note = "登録できるのは、あなたの現職の企業だけです(利用規約で定めます)。一覧には、すべての企業が載っています。"

# --- プロフィールの選択肢の表示名(§5 の 1・§2.6)。キーは config/params.toml の [attribute_bands.*] のグリッドと一致させる ---
