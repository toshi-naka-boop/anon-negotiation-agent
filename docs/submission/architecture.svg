<svg xmlns="http://www.w3.org/2000/svg" width="1810" height="930" viewBox="0 0 1810 930" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Yu Gothic, Meiryo, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b42318"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1810" height="930" fill="#ffffff"/>

  <!-- 題 -->
  <text x="40" y="58" font-size="30" font-weight="700" fill="#1c2128">匿名交渉エージェント：アーキテクチャと信頼境界</text>
  <text x="40" y="92" font-size="17" fill="#4b5563">本音を預けられる転職エージェント。本音は面談の後すぐに丸め、金庫の中では丸めた値としてだけ扱う。</text>

  <!-- 利用者 -->
  <rect x="40" y="120" width="240" height="530" rx="14" fill="#eef4fd" stroke="#1d5fc4" stroke-width="2"/>
  <text x="56" y="152" font-size="19" font-weight="700" fill="#1d5fc4">利用者（ブラウザ）</text>
  <rect x="56" y="170" width="208" height="130" rx="10" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="72" y="200" font-size="18" font-weight="700" fill="#1c2128">求職者</text>
  <text x="72" y="228" font-size="15" fill="#1c2128">面談で本音を預ける</text>
  <text x="72" y="252" font-size="15" fill="#1c2128">自分の交渉を見る</text>
  <text x="72" y="276" font-size="15" fill="#1c2128">「会う」「承認」を押す</text>
  <rect x="56" y="320" width="208" height="130" rx="10" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="72" y="350" font-size="18" font-weight="700" fill="#1c2128">求人側（架空）</text>
  <text x="72" y="378" font-size="15" fill="#1c2128">求人担当の画面</text>
  <text x="72" y="402" font-size="15" fill="#1c2128">デモ・自動で応答</text>
  <text x="72" y="426" font-size="15" fill="#1c2128">自分の側の記録だけ</text>
  <rect x="56" y="470" width="208" height="160" rx="10" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="72" y="500" font-size="18" font-weight="700" fill="#1c2128">審査員・疑う人</text>
  <text x="72" y="528" font-size="15" fill="#1c2128">攻撃してみる</text>
  <text x="72" y="552" font-size="15" fill="#1c2128">（架空の人物だけ）</text>
  <text x="72" y="580" font-size="15" fill="#1c2128">金庫の確認（TEE）</text>
  <text x="72" y="604" font-size="15" fill="#1c2128">で検証する</text>

  <!-- 運営者が中身を変えられる区画 -->
  <rect x="380" y="120" width="680" height="530" rx="14" fill="#f4f5f7" stroke="#6b7280" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="398" y="152" font-size="19" font-weight="700" fill="#374151">運営者が中身を変えられる区画（Google Cloud）</text>

  <rect x="400" y="170" width="640" height="260" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="418" y="200" font-size="18" font-weight="700" fill="#1c2128">web（Cloud Run・1 台）</text>
  <rect x="420" y="215" width="290" height="85" rx="8" fill="#fff7f6" stroke="#e5a8a1"/>
  <text x="436" y="242" font-size="16" font-weight="700" fill="#1c2128">面談エージェント（ADK）</text>
  <text x="436" y="267" font-size="14" fill="#b42318">生の値を扱うのは面談の間だけ</text>
  <text x="436" y="289" font-size="14" fill="#1c2128">送ったら面談の記録は捨てる</text>
  <rect x="730" y="215" width="290" height="85" rx="8" fill="#f0faf8" stroke="#8fcfc5"/>
  <text x="746" y="242" font-size="16" font-weight="700" fill="#1c2128">丸め（決まったとおりのコード）</text>
  <text x="746" y="267" font-size="14" fill="#0f766e">年収は 50 万円のマスに丸める</text>
  <text x="746" y="289" font-size="14" fill="#1c2128">生の値は金庫に送らない</text>
  <rect x="420" y="320" width="290" height="90" rx="8" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="436" y="347" font-size="16" font-weight="700" fill="#1c2128">段階開示・開示台帳</text>
  <text x="436" y="372" font-size="14" fill="#1c2128">活動ログは側ごとの見え方で</text>
  <text x="436" y="395" font-size="14" fill="#1c2128">回数の枠・本人の確認</text>
  <rect x="730" y="320" width="290" height="90" rx="8" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="746" y="347" font-size="16" font-weight="700" fill="#1c2128">レフェリー・見回り</text>
  <text x="746" y="372" font-size="14" fill="#1c2128">交渉を手番どおりに進める</text>
  <text x="746" y="395" font-size="14" fill="#1c2128">AI の手を金庫に登録する</text>

  <text x="430" y="444" font-size="13" fill="#374151">A2A：決まった形のメッセージだけ</text>
  <rect x="400" y="450" width="360" height="180" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="418" y="478" font-size="18" font-weight="700" fill="#1c2128">agents（Cloud Run）</text>
  <text x="418" y="500" font-size="13" fill="#4b5563">呼べるのは web だけ・ADK と Gemini</text>
  <rect x="420" y="515" width="160" height="95" rx="8" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="436" y="545" font-size="15" font-weight="700" fill="#1c2128">求職者側の</text>
  <text x="436" y="567" font-size="15" font-weight="700" fill="#1c2128">交渉エージェント</text>
  <text x="436" y="592" font-size="13" fill="#4b5563">計画と決定</text>
  <rect x="590" y="515" width="160" height="95" rx="8" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="606" y="545" font-size="15" font-weight="700" fill="#1c2128">求人側の</text>
  <text x="606" y="567" font-size="15" font-weight="700" fill="#1c2128">交渉エージェント</text>
  <text x="606" y="592" font-size="13" fill="#4b5563">計画と決定</text>

  <rect x="780" y="450" width="260" height="80" rx="8" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="796" y="478" font-size="16" font-weight="700" fill="#1c2128">Firestore (default)</text>
  <text x="796" y="503" font-size="14" fill="#1c2128">セッション・段階開示・枠</text>
  <rect x="780" y="545" width="260" height="85" rx="8" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="796" y="573" font-size="16" font-weight="700" fill="#1c2128">Firestore vault-db</text>
  <text x="796" y="598" font-size="14" fill="#1c2128">金庫の保存データ</text>
  <text x="796" y="619" font-size="14" fill="#0f766e">本人の分は暗号化して保存</text>

  <!-- 動いているコードを確かめられる区画（TEE） -->
  <rect x="1220" y="120" width="550" height="530" rx="14" fill="#fef3f2" stroke="#b42318" stroke-width="2.5"/>
  <text x="1238" y="152" font-size="19" font-weight="700" fill="#b42318">動いているコードを確かめられる区画（TEE）</text>
  <rect x="1240" y="170" width="510" height="270" rx="12" fill="#ffffff" stroke="#b42318" stroke-width="1.5"/>
  <text x="1260" y="205" font-size="20" font-weight="700" fill="#1c2128">金庫（vault）</text>
  <text x="1260" y="230" font-size="14" fill="#4b5563">Confidential Space の機密 VM・外部 IP なし</text>
  <text x="1260" y="268" font-size="16" fill="#1c2128">・AI ではない、決まったとおりに動くプログラム</text>
  <text x="1260" y="298" font-size="16" fill="#1c2128">・持つのは丸め済みの条件だけ</text>
  <text x="1260" y="328" font-size="16" fill="#1c2128">・答えは 3 通りだけ</text>
  <text x="1276" y="354" font-size="15" fill="#4b5563">（受けられる／受けられない／本人確認が必要）</text>
  <text x="1260" y="386" font-size="16" fill="#1c2128">・交渉の状態・回数・予算・期限</text>
  <text x="1260" y="416" font-size="16" fill="#1c2128">・最終判定（終わったときに 1 回だけ見込みを出す）</text>
  <rect x="1240" y="460" width="510" height="85" rx="8" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="1260" y="488" font-size="16" font-weight="700" fill="#1c2128">Cloud KMS（保存データの鍵）</text>
  <text x="1260" y="513" font-size="14" fill="#1c2128">鍵を使えるのは、検証済みのイメージ（ダイジェスト）と</text>
  <text x="1260" y="534" font-size="14" fill="#1c2128">プロジェクトのオーナーだけ（デプロイの確認で照合）</text>
  <rect x="1240" y="560" width="510" height="75" rx="8" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="1260" y="588" font-size="16" font-weight="700" fill="#1c2128">誰でも確かめられること</text>
  <text x="1260" y="613" font-size="14" fill="#1c2128">動いている金庫のイメージと本番の条件（画面の「金庫の確認」）</text>

  <!-- 外のサービス -->
  <rect x="400" y="700" width="360" height="90" rx="10" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="418" y="728" font-size="16" font-weight="700" fill="#1c2128">Vertex AI Gemini（キャッシュ無効）</text>
  <text x="418" y="752" font-size="14" fill="#1c2128">交渉：グリッド上の値と 3 通りの答えだけ</text>
  <text x="418" y="774" font-size="14" fill="#b42318">面談：回答の読み取り（面談の間だけ）</text>
  <rect x="1240" y="700" width="250" height="90" rx="10" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="1258" y="728" font-size="16" font-weight="700" fill="#1c2128">attestation（Google）</text>
  <text x="1258" y="752" font-size="14" fill="#1c2128">Confidential Space の</text>
  <text x="1258" y="774" font-size="14" fill="#1c2128">証明のトークン</text>
  <rect x="1500" y="700" width="250" height="90" rx="10" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="1518" y="728" font-size="16" font-weight="700" fill="#1c2128">GitHub（公開）</text>
  <text x="1518" y="752" font-size="14" fill="#1c2128">金庫のソースと、</text>
  <text x="1518" y="774" font-size="14" fill="#1c2128">イメージとコミットの対応表</text>

  <!-- 矢印 -->
  <text x="296" y="238" font-size="13" fill="#b42318">面談の回答</text>
  <text x="296" y="254" font-size="13" fill="#b42318">（生の値）</text>
  <path d="M 264 262 L 416 262" stroke="#b42318" stroke-width="2" fill="none" marker-end="url(#arrow-red)"/>
  <path d="M 710 257 L 726 257" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="1075" y="247" font-size="13" fill="#0f766e">丸め済みの条件だけ</text>
  <path d="M 1020 257 L 1236 257" stroke="#0f766e" stroke-width="2" fill="none" marker-end="url(#arrow-teal)"/>
  <text x="1072" y="352" font-size="13" fill="#374151">手の登録・確かめ</text>
  <path d="M 1020 365 L 1236 365" stroke="#374151" stroke-width="2" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="1072" y="386" font-size="13" fill="#374151">3 通りの答え</text>
  <text x="1072" y="404" font-size="12" fill="#4b5563">TLS：検証してから固定</text>
  <path d="M 830 410 L 735 448" stroke="#374151" stroke-width="2" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path d="M 580 630 L 580 696" stroke="#0f766e" stroke-width="2" fill="none" marker-start="url(#arrow-teal)" marker-end="url(#arrow-teal)"/>
  <text x="592" y="668" font-size="13" fill="#0f766e">本音の数字なし</text>
  <path d="M 420 290 L 392 290 L 392 745 L 398 745" stroke="#b42318" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrow-red)"/>
  <path d="M 1495 440 L 1495 458" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 1240 420 L 1140 420 L 1140 590 L 1044 590" stroke="#0f766e" stroke-width="2" fill="none" marker-end="url(#arrow-teal)"/>
  <text x="1150" y="500" font-size="13" fill="#0f766e">暗号化して</text>
  <text x="1150" y="518" font-size="13" fill="#0f766e">保存</text>
  <text x="290" y="353" font-size="13" fill="#374151">側ごとの記録</text>
  <path d="M 420 340 L 268 290" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 420 365 L 268 385" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 1365 635 L 1365 700" stroke="#9aa5b1" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
  <path d="M 1625 635 L 1625 700" stroke="#9aa5b1" stroke-width="2" stroke-dasharray="5 4" fill="none"/>

  <!-- 注記 -->
  <rect x="40" y="820" width="840" height="90" rx="10" fill="#e0f2f1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="60" y="850" font-size="16" font-weight="700" fill="#0f766e">AI に渡るもの</text>
  <text x="60" y="880" font-size="15" fill="#1c2128">交渉の AI に渡るのは、グリッド上の値と、金庫の 3 通りの答えだけ。本音の数字は渡らない。</text>
  <rect x="900" y="820" width="870" height="90" rx="10" fill="#fef3f2" stroke="#b42318" stroke-width="1.5"/>
  <text x="920" y="850" font-size="16" font-weight="700" fill="#b42318">TEE でも言えないこと</text>
  <text x="920" y="876" font-size="14" fill="#1c2128">面談中の生の値は web が扱う。運営側のコードは手を登録でき、丸め済みの条件も読める。</text>
  <text x="920" y="898" font-size="14" fill="#1c2128">それでも分かるのは丸めた値（年収なら 50 万円の幅）まで。</text>
</svg>
